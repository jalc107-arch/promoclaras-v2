name: Sinuano staging - pruebas de seguridad sin credenciales
on:
  push:
    branches:
      - feature/sinuano-admin-staging-20261017
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias sin secretos
        run: npm ci --no-audit --no-fund
      - name: Validar sintaxis
        run: |
          node --check index.js
          node --check services/dailyDrawCalendar.mjs
          node --check services/dailyDrawSimulation.mjs
          node --check services/dailyDrawAdmin.mjs
          node --check services/dailyDrawPreparation.mjs
          node --check services/sinuanoAccess.mjs
      - name: Pruebas locales sin acceso a Supabase ni Wompi
        run: node --test test/*.mjs test/*.cjs
  postgres-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: sinuano_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sinuano_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ephemeral_ci_only
      PGDATABASE: sinuano_integration
    steps:
      - uses: actions/checkout@v4
      - name: Cliente PostgreSQL
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Esquema minimo completamente ficticio
        run: psql -X -v ON_ERROR_STOP=1 -f test/sql/sinuano_reconciliation_schema.sql
      - name: Ejecutar la migracion real
        run: psql -X -v ON_ERROR_STOP=1 -f migrations/20261018_staging_daily_reversal_reconciliation_guard.sql
      - name: Casos de aprobacion, reversion y alcance
        run: psql -X -v ON_ERROR_STOP=1 -f test/sql/sinuano_reconciliation_cases.sql
      - name: Crear base temporal separada para las 31 jornadas
        run: createdb sinuano_daily_results
      - name: Preparar esquema sintético y funciones originales de adjudicación
        run: |
          export PGDATABASE=sinuano_daily_results
          sed '/^CREATE ROLE /d' test/sql/sinuano_reconciliation_schema.sql | psql -X -v ON_ERROR_STOP=1
          psql -X -v ON_ERROR_STOP=1 -f test/sql/sinuano_daily_results_schema.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/20261017_staging_daily_result_atomic.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/20261018_staging_daily_missing_activation_fail_closed_20261017.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/20261018_staging_daily_reversal_reconciliation_guard.sql
      - name: Aplicar regla mensual de premio mayor en PostgreSQL
        run: PGDATABASE=sinuano_daily_results psql -X -v ON_ERROR_STOP=1 -f migrations/20261018_staging_daily_month_end_major_guard.sql
      - name: Probar 31 jornadas sin tocar Supabase
        run: PGDATABASE=sinuano_daily_results psql -X -v ON_ERROR_STOP=1 -f test/sql/sinuano_daily_results_cases.sql
      - name: Confirmar el último día de cada mes y la exclusividad del premio
        run: PGDATABASE=sinuano_daily_results psql -X -v ON_ERROR_STOP=1 -f test/sql/sinuano_month_end_major_guard_cases.sql
      - name: Preparar tercera base temporal para pagos completos
        run: |
          createdb sinuano_atomic_payment
          export PGDATABASE=sinuano_atomic_payment
          sed '/^CREATE ROLE /d' test/sql/sinuano_reconciliation_schema.sql | psql -X -v ON_ERROR_STOP=1
          sed '/^CREATE ROLE service_role NOLOGIN;$/d' test/sql/sinuano_daily_results_schema.sql | psql -X -v ON_ERROR_STOP=1
          psql -X -v ON_ERROR_STOP=1 -f test/sql/sinuano_atomic_payment_schema.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/20261017_staging_daily_activation_guard.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/20261018_staging_daily_atomic_full_payment_activation.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/20261018_staging_daily_commerce_gate.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/20261018_staging_daily_wompi_verified_events.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/20261018_staging_daily_wompi_void_atomic.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/20261018_staging_daily_verified_void_single_transaction.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/20261018_staging_daily_verified_void_draw_gate.sql
      - name: Pago completo, idempotencia y proteccion de campañas tradicionales
        run: PGDATABASE=sinuano_atomic_payment psql -X -v ON_ERROR_STOP=1 -f test/sql/sinuano_atomic_payment_cases.sql
      - name: Dos pedidos aprobados simultaneamente, sin compartir códigos
        shell: bash
        run: |
          set -euo pipefail
          export PGDATABASE=sinuano_atomic_payment
          psql -X -v ON_ERROR_STOP=1 -f test/sql/sinuano_concurrent_orders_setup.sql
          psql -X -v ON_ERROR_STOP=1 -c "SELECT * FROM public.system_daily_finalize_full_payment_atomic('10101010-1010-4010-8010-101010101010','sandbox_concurrent_A_1010')" &
          pid_a=$!
          psql -X -v ON_ERROR_STOP=1 -c "SELECT * FROM public.system_daily_finalize_full_payment_atomic('20202020-2020-4020-8020-202020202020','sandbox_concurrent_B_2020')" &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"
          psql -X -v ON_ERROR_STOP=1 -f test/sql/sinuano_concurrent_orders_assert.sql
      - name: Ledger Wompi, VOIDED atómico y resistencia a reproducciones
        run: PGDATABASE=sinuano_atomic_payment psql -X -v ON_ERROR_STOP=1 -f test/sql/sinuano_wompi_ledger_void_cases.sql
      - name: Verificar transacción indivisible del evento VOIDED
        run: PGDATABASE=sinuano_atomic_payment psql -X -v ON_ERROR_STOP=1 -f test/sql/sinuano_wompi_atomic_signed_void_cases.sql
      - name: Validar doble bloqueo documental en una cuarta base temporal
        run: |
          createdb sinuano_documentary
          export PGDATABASE=sinuano_documentary
          sed '/^CREATE ROLE /d' test/sql/sinuano_documentary_fixture.sql | psql -X -v ON_ERROR_STOP=1
          psql -X -v ON_ERROR_STOP=1 -f migrations/20261018_staging_daily_documentary_approval_guard.sql
          psql -X -v ON_ERROR_STOP=1 -f test/sql/sinuano_documentary_block_cases.sql



